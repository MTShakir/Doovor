# Hosted settings for the staging project (D-049, D-050). Apply with:
#   pnpm supabase config diff --workdir ops/staging --project-ref yvxuarrrvgnfcjfyqfyi
#   pnpm supabase config push --workdir ops/staging --project-ref yvxuarrrvgnfcjfyqfyi
#
# Separate from supabase/config.toml on purpose: that file carries local-only settings, above
# all the test phone numbers, which must never reach a hosted project. Only what this file
# declares is pushed. Brand values come from brand.ts through scripts/supabase.mjs (rule 8),
# and provider secrets come from .env.local.
project_id = "yvxuarrrvgnfcjfyqfyi"

[auth]
site_url = "env(BRAND_SITE_URL)"
# Exact addresses only: a wildcard on a shared host would let a look-alike site collect
# sign-in tokens (D-046).
additional_redirect_urls = ["env(BRAND_REDIRECT_URL)"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
# Refusing passwords that appear in known breaches is a hosted setting the CLI has no key
# for, so it is a switch in the dashboard rather than a line here (RUNBOOK 3.4).

# Supabase's own defaults, not the generous local ones. Text codes stay tight: a public code
# endpoint attracts SMS pumping fraud.
[auth.rate_limit]
email_sent = 30
sms_sent = 10
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"

# Resend over SMTP. Supabase's built-in sender only reaches project members.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(BRAND_SENDER_EMAIL)"
sender_name = "env(BRAND_SENDER_NAME)"

# Text codes through Twilio (D-033): they verify an instructor's mobile (AUTH-02) and sign in
# somebody whose mobile is verified. Nobody signs up with a phone number alone, which also keeps
# a public code endpoint from sending texts at our expense. No test numbers here: those are local.
[auth.sms]
enable_signup = false
# Read backwards on purpose. For a hosted project the CLI sends this value as `sms_autoconfirm`,
# the opposite of its name: `true` switched "Enable phone confirmations" off on 18 September
# 2026, and a changed mobile then counted as verified without a code. `false` keeps the code.
# The local file says `true` for the same result, because the CLI reads it the other way round
# for the local stack. `scripts/supabase.mjs` checks the hosted switch after every push (D-155).
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "60s"

[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGING_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Google stays off until its client secret is in .env.local. skip_nonce_check is a local-only
# convenience; hosted sign-in keeps the check.
[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false
