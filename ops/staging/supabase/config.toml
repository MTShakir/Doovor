# Hosted settings for the staging project (D-049, D-050). Apply with:
#   pnpm supabase config diff --workdir ops/staging --project-ref yvxuarrrvgnfcjfyqfyi
#   pnpm supabase config push --workdir ops/staging --project-ref yvxuarrrvgnfcjfyqfyi
#
# Separate from supabase/config.toml on purpose: that file carries local-only settings, above
# all the test phone numbers, which must never reach a hosted project. Only what this file
# declares is pushed. Brand values come from brand.ts through scripts/supabase.mjs (rule 8),
# and provider secrets come from .env.local.
project_id = "yvxuarrrvgnfcjfyqfyi"

[auth]
site_url = "env(BRAND_SITE_URL)"
# Exact addresses only: a wildcard on a shared host would let a look-alike site collect
# sign-in tokens (D-046).
additional_redirect_urls = ["env(BRAND_REDIRECT_URL)"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
# Refusing passwords that appear in known breaches is a hosted setting the CLI has no key
# for, so it is a switch in the dashboard rather than a line here (RUNBOOK 3.4).

# Supabase's own defaults, not the generous local ones. Text codes stay tight: a public code
# endpoint attracts SMS pumping fraud.
[auth.rate_limit]
email_sent = 30
sms_sent = 10
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"

# Resend over SMTP. Supabase's built-in sender only reaches project members.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(BRAND_SENDER_EMAIL)"
sender_name = "env(BRAND_SENDER_NAME)"

# Text message settings are deliberately not declared here, so whatever is set in the Supabase
# dashboard stays as it is. Declare them once Twilio is off its trial and TWILIO_* are in
# .env.local, so this file describes them too.

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Google stays off until its client secret is in .env.local. skip_nonce_check is a local-only
# convenience; hosted sign-in keeps the check.
[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false
