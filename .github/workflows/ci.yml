# Every push and pull request: lint, types, unit tests, database tests, end-to-end flows at 390
# and 1440 px against a production build (M0-31, PRD 14.5), and Lighthouse on the public pages
# (NFR-PERF-04, M5-24).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # Services the tests do not use, left out to start the local Supabase stack faster.
  SUPABASE_EXCLUDE: studio,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and copy guard
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (core coverage gate 90%)
        run: pnpm test
      - name: Dependency advisories (high and above)
        # Anything high or critical fails the build. An advisory with no fixed version is read and
        # listed in pnpm-workspace.yaml with the reason (M6-02, D-136).
        run: pnpm audit --audit-level=high

  database:
    name: Database tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: node scripts/supabase.mjs start -x "$SUPABASE_EXCLUDE"
      - name: Lint SQL functions
        run: pnpm db:lint
      - name: pgTAP (RLS, constraints, RPCs)
        run: pnpm db:test
      - name: Generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code -- packages/db/src/types.gen.ts

  e2e:
    name: End to end (390 and 1440 px)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: node scripts/supabase.mjs start -x "$SUPABASE_EXCLUDE"
      - name: Write .env.local for the local stack
        run: node scripts/local-env.mjs --app-env=test
      - name: Production build
        # Build output is only in the logs, which need repository admin. Put the tail of a
        # failure in an annotation, which anyone who can see the run can read.
        run: |
          set -o pipefail
          if ! pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            echo "::error title=Production build failed::$(tail -n 25 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Install Chromium
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/screenshots
          retention-days: 14

  lighthouse:
    # Public profile and city pages score 90 or more in every category, from a production build
    # and the seeded database (NFR-PERF-04, M5-24). The scores are in the job's summary.
    name: Lighthouse (public pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: node scripts/supabase.mjs start -x "$SUPABASE_EXCLUDE"
      - name: Write .env.local for the local stack
        run: node scripts/local-env.mjs --app-env=test
      - name: Seed the public pages
        run: pnpm db:seed
      - name: Production build
        run: |
          set -o pipefail
          if ! pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            echo "::error title=Production build failed::$(tail -n 25 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Start the app
        run: |
          pnpm --filter @repo/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 50 "$RUNNER_TEMP/web.log"
          exit 1
      - name: Lighthouse
        # Logs need repository admin, so the scores, or the tail of a failure, go in annotations too.
        run: |
          set -o pipefail
          if ! pnpm lighthouse 2>&1 | tee "$RUNNER_TEMP/lighthouse.log"; then
            echo "::error title=Lighthouse failed::$(tail -n 40 "$RUNNER_TEMP/lighthouse.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "::notice title=Lighthouse scores::$(grep '^|' "$RUNNER_TEMP/lighthouse.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14

  load:
    # The reads a busy evening is made of, and booking with enough learners at once that two go for
    # the same slot: p95 under 300 ms for reads and 600 ms for a booking (NFR-PERF-02, M6-05).
    name: Load (reads and booking)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: grafana/setup-k6-action@v1
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: node scripts/supabase.mjs start -x "$SUPABASE_EXCLUDE"
      - name: Write .env.local for the local stack
        run: node scripts/local-env.mjs --app-env=test
      - name: Seed
        run: pnpm db:seed
      - name: Production build
        run: |
          set -o pipefail
          if ! pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            echo "::error title=Production build failed::$(tail -n 25 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Start the app
        run: |
          pnpm --filter @repo/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 50 "$RUNNER_TEMP/web.log"
          exit 1
      - name: What the load tests are about
        run: node scripts/load-fixtures.mjs
      - name: Reads
        # Logs need repository admin, so the timings go in annotations as well (M5-24's habit).
        run: |
          set -o pipefail
          if ! k6 run --quiet load/reads.js 2>&1 | tee "$RUNNER_TEMP/reads.log"; then
            echo "::error title=Load (reads) failed::$(grep -E 'http_req_duration|read_|✗|THRESHOLD' "$RUNNER_TEMP/reads.log" | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "::notice title=Load (reads)::$(grep -E '^ +(http_req|read_|checks|iterations)' "$RUNNER_TEMP/reads.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Booking
        run: |
          set -o pipefail
          if ! k6 run --quiet load/booking.js 2>&1 | tee "$RUNNER_TEMP/booking.log"; then
            echo "::error title=Load (booking) failed::$(grep -E 'http_req_duration|write_|bookings_|✗|THRESHOLD' "$RUNNER_TEMP/booking.log" | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "::notice title=Load (booking)::$(grep -E '^ +(http_req|write_|read_|bookings_|checks|iterations)' "$RUNNER_TEMP/booking.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Upload the runs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: load
          path: |
            ${{ runner.temp }}/reads.log
            ${{ runner.temp }}/booking.log
          retention-days: 14
