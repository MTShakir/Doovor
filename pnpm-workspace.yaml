packages:
  - apps/*
  - packages/*
  - e2e

# Supply chain (D-025): pnpm refuses versions younger than 24 hours by default
# (minimumReleaseAge 1440). Releases from the last 30 days must not lose provenance
# compared with earlier releases, which is how a package takeover usually shows up.
# Older releases predate npm provenance and are trusted by age.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

# Dependencies allowed to run install scripts. Anything new must be reviewed and added here.
allowBuilds:
  # Reviewed, not needed: its script downloads the Sentry command line tool, which only a
  # build that uploads source maps uses. We do not, so nothing needs it (M6-10, D-150).
  '@sentry/cli': false
  # Reviewed, not needed: its script checks the native binding and, if it is missing,
  # installs a WebAssembly fallback. pnpm installs the binding as an optional dependency.
  '@swc/core': false
  # Reviewed, not needed: its script only prints a message asking for funding. It builds
  # nothing (pulled in by posthog-js).
  core-js: false
  # Reviewed, not needed: its script only checks for the platform binary, which pnpm
  # already installs as an optional dependency.
  esbuild: false
  # Reviewed, not needed: its script only prints warnings about dependents' version
  # schemes. It generates nothing (pulled in by inngest through OpenTelemetry).
  protobufjs: false

# Versions raised above what a dependency asks for, to leave an advisory behind (M6-02, D-136).
# Most are build or test tools. The one that is not says so, with what it reaches.
overrides:
  # A certificate that should not have been trusted can be reported as authorised. It arrives
  # under the job runner, through an OpenTelemetry metrics exporter we do not configure and do
  # not send anything to, so nothing here speaks gRPC today. Raised anyway: "we do not use that
  # path" is a statement about this week's configuration, not a property of the dependency.
  '@grpc/grpc-js': '>=1.14.5'
  # Unbounded memory growth and a crash on untrusted data, under Serwist at build time.
  browserslist: '>=4.28.7'
  # Quadratic-time CPU denial of service in the Unix directory listing parser of Client.list().
  # It reaches us only through Lighthouse CI's proxy and browser-download paths, which this repo
  # never walks: the Lighthouse job measures with the runner's own Chrome and resolves no ftp://
  # URI. Raised rather than ignored because a fixed version exists, which is what separates this
  # from the two advisories in auditConfig below. 5.3.1 is what resolves without this, and the
  # fix landed in a new major, so this is a major bump for a tool that never runs in anger.
  basic-ftp: '>=6.2.1 <7'
  # Path traversal through a prefix, under Lighthouse CI.
  tmp: '>=0.2.6'
  # Missing bounds check when given a buffer, under Lighthouse CI.
  uuid: '>=11.1.1'
  # Stack exhaustion from nested brace groups and from parseCommaParts. It reaches us three times
  # over, once per major, all of it under the eslint and Lighthouse toolchains, which read our own
  # files at development time and never a visitor's input. Fixed in each line, so each line is
  # pinned rather than collapsed onto one: brace-expansion 1 and 2 are what minimatch's older
  # majors ask for.
  # Each line is bounded at both ends on purpose. An open ">=1.1.20" is satisfied by 5.0.9, so it
  # lifted minimatch 3 four majors and left it vulnerable anyway.
  brace-expansion@1: '>=1.1.20 <2'
  brace-expansion@2: '>=2.1.6 <3'
  brace-expansion@4: '>=5.0.11'
  brace-expansion@5: '>=5.0.11'

# An advisory with no fixed version, read and accepted (M6-02, D-136). extract-zip reaches us only
# through Lighthouse CI's browser downloader, which never runs: the Lighthouse job measures with the
# runner's own Chrome. Reviewed 17 September 2026; drop this once a fixed version exists.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3

# Shared versions. Workspace packages reference these with "catalog:".
catalog:
  "@types/node": ^26.6.3
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  eslint: ^10.10.0
  # 16.3.6 fixes a critical remote code execution in next/og, which the public share images use.
  next: ^16.3.6
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwindcss: ^4.3.0
  "@tailwindcss/postcss": ^4.3.0
  typescript: ~6.0.3
  vitest: ^5.0.0
  "@vitest/coverage-v8": ^5.0.0
  zod: ^4.6.0
  lucide-react: ^1.44.0
  "@supabase/supabase-js": ^2.116.0
  "@supabase/ssr": ^0.12.0
  react-hook-form: ^7.87.0
  "@hookform/resolvers": ^5.9.0
